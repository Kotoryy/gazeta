/* ---------- tokens ---------- */
:root {
  --desk: #d9d2c3;
  --paper: #f4efe3;
  --ink: #1d1b17;
  --ink-2: #4a453c;
  --ink-3: #7a7365;
  --rule: #1d1b17;
  --hair: #c9c0ad;
  --accent: #8c1c13;
  --tint: #ebe4d3;
  --img-blend: multiply;
  --img-filter: grayscale(1) contrast(1.08) brightness(1.02);
  --shadow: 0 1px 2px rgba(60, 50, 30, .12), 0 12px 40px rgba(60, 50, 30, .18);
  --head: "Playfair Display", "PT Serif", Georgia, serif;
  --old: "Old Standard TT", "PT Serif", Georgia, serif;
  --body: "PT Serif", Georgia, serif;
  color-scheme: light;
}

/* ---------- base ---------- */
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  overflow: hidden;
  background: var(--desk);
  background-image: radial-gradient(ellipse at 50% 40%, rgba(255, 255, 255, .35), rgba(0, 0, 0, .08) 75%);
  color: var(--ink);
  font-family: var(--body);
  line-height: 1.4;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }
a:hover .hl, a.hl:hover { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; }
button { font: inherit; color: inherit; }

/* ---------- toolbar ---------- */
.toolbar {
  position: fixed; inset: 0 0 auto 0; height: 46px; z-index: 5;
  display: flex; align-items: center; gap: 14px; padding: 0 16px;
  font-family: var(--old); font-size: 13px; letter-spacing: .06em; color: var(--ink-2);
}
.toolbar .brand { font-family: var(--head); font-weight: 900; font-size: 20px; letter-spacing: 0; color: var(--ink); }
.toolbar .grow { flex: 1; }
.tb-btn {
  background: none; border: 1px solid transparent; border-radius: 2px; padding: 4px 8px; cursor: pointer;
  font-family: var(--old); font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink);
}
.tb-btn:hover { border-color: var(--ink-3); }
.tb-btn:focus-visible, .btn:focus-visible, .turn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tb-btn[disabled] { opacity: .5; cursor: progress; }
.tb-arrow { font-family: var(--body); font-size: 24px; line-height: 1; padding: 0 10px 3px; text-transform: none; }
.tb-select {
  font-family: var(--old); font-size: 13px; color: var(--ink); background: transparent;
  border: 1px solid var(--hair); border-radius: 2px; padding: 3px 6px; max-width: 220px;
}
.indicator { min-width: 104px; text-align: center; font-variant-numeric: tabular-nums; }

/* ---------- stage, book, pages ---------- */
.paper-root { position: fixed; inset: 46px 0 0 0; }
.stage { position: absolute; inset: 0; display: grid; place-items: center; perspective: 2800px; overflow: hidden; }

.leaf.on-left .face.front .page::after { right: 0; background: linear-gradient(to left, rgba(70, 55, 30, .2), transparent); }

espect for Thelonious … Read More \"From Paris and New York, Live, with Love: Thelonious Monk Birthday Month\"","image":"https://www.jazztimes.com/wp-content/uploads/2026/10/Thelonious_Monk_Mintons_Playhouse_New_York_N.Y._ca._Sept._1947_William_P._Gottlieb_06221-1953x2048-1.jpg","source":"JazzTimes"}]},{"id":"classical","title":"Классическая музыка","items":[{"title":"К юбилею патриарха","link":"https://www.classicalmusicnews.ru/anons/k-yubileyu-patriarha/","date":1791476088000,"summary":"Патриарху посвятят оперу. Постановку «Кирилл и Мефодий» представят 24 ноября 2026 года в Большом зале Московской консерватории.","image":"https://www.classicalmusicnews.ru/wp-content/uploads/2026/10/kirillmefody.jpg","source":"Новости классической музыки"},{"title":"Случайный автограф и табуретка: как начался путь Анастасии Сагайдак к сцене Ла Скала","link":"https://www.classicalmusicnews.ru/news/anastasia-sagaidak-2026/","date":1791474018000,"summary":"Автограф, который Ильдар Абдразаков поставил наугад, оказался пророческим: «Увидимся скоро на сцене Ла Скала». Через пару месяцев они встретились — он в жюри, она на сцене. Ла Скала пока не случилась, но Teatro di San Carlo в Неаполе уже.","image":"https://www.classicalmusicnews.ru/wp-content/uploads/2026/10/sagaidak.jpg","source":"Новости классической музыки"},{"title":"От Ленина до ЦСКА: британская Opera North перенесла «Евгения Онегина» в эпоху распада СССР","link":"https://www.classicalmusicnews.ru/reports/opera-north-eugene-onegin/","date":1791470841000,"summary":"9 октября 2026 года в Leeds Grand Theatre состоится премьера новой постановки «Евгения Онегина» Петра Ильича Чайковского. Режиссёр Патрик Нолан переносит действие оперы из дворянской России XIX века в последние десятилетия существования Советского Союза.","image":"https://www.classicalmusicnews.ru/wp-content/uploads/2026/10/5348519789166534344_121.jpg","source":"Новости классической музыки"},{"title":"Ненавязчивая настойчивость","link":"https://muzlifemagazine.ru/nenavyazchivaya-nastoychivost/","date":1791468573000,"summary":"Cила понимания Любые мифы рушимы – даже те, что имеют четкие контуры убедительности. Бесспорно: в «переполненном вагоне» московской культурной жизни есть всё и все, но не бесповоротно.","image":"https://muzlifemagazine.ru/wp-content/uploads/2026/10/ak-00139-1024x683.jpg","source":"Музыкальная жизнь"},{"title":"Сэр Саймон Рэттл продлил контракт с Симфоническим оркестром Баварского радио","link":"https://muzlifemagazine.ru/syer-saymon-ryettl-prodlil-kontrakt-s-si/","date":1791465849000,"summary":"Легендарный британский дирижер сэр Саймон Рэттл останется за пульт ом Симфонического оркестра Баварского радио (Symphonieorchester des Bayerischen Rundfunks) еще на семь лет. Его контракт в должности главного дирижера (Chief Conductor) продлен до 2033 года.","image":"","source":"Музыкальная жизнь"},{"title":"Александр Малофеев стал лауреатом премии Gramophone","link":"https://muzlifemagazine.ru/aleksandr-malofeev-stal-laureatom-pr/","date":1791461590000,"summary":"7 октября в Лондоне состоялась церемония вручения престижной премии Gramophone Classical Music Awards 2026. Мероприятие, организованное журналом Gramophone в партнерстве с Presto Music, прошло в районе Ковент-Гарден, в De Vere Grand Connaught Rooms, где собрались ведущие представители классической музыкальной…","image":"","source":"Музыкальная жизнь"},{"title":"В Мурманской области пройдут гастроли Балета имени Касаткиной и Василёва","link":"http://belcanto.ru/26100805.html","date":1791446702000,"summary":"В Мурманской области с 8 по 14 октября пройдут первые гастроли Государственного академического театра классического балета имени Наталии Касаткиной и Владимира Василёва. Событие состоится в рамках федеральной программы «Большие гастроли» при поддержке Росконцерта и Министерства культуры РФ.","image":"/media/images/collective/thumbnail300_13052505.jpg","source":"Belcanto.ru"},{"title":"Симфонический оркестр Санкт-Петербурга имени Стадлера продолжит дело Маэстро","link":"http://belcanto.ru/26100804.html","date":1791445338000,"summary":"Симфонический оркестр Санкт-Петербурга, который с 1 октября носит имя своего создателя — скрипача и дирижера с мировой славой Сергея Стадлера , открывает новый сезон. В пятницу, 9 октября, коллектив выступит на сцене Эрмитажного театра в спектакле «Неизвестный Прокофьев.","image":"/media/images/publication/thumbnail300_stadler.jpg","source":"Belcanto.ru"}]},{"id":"science","title":"Наука","items":[{"title":"Умерла информатик Маргарет Гамильтон","link":"https://nplus1.ru/news/2026/10/08/margaret-hamilton","date":1791473940000,"summary":"Американская информатик Маргарет Гамильтон (Margaret Elaine Hamilton), руководившая разработкой программного обеспечения для космической программы NASA «Аполлон», умерла в среду, 30 сентября. Ей было 90 лет. О смерти ученой сообщила пресс-служба Массачусетского технологического университета.","image":"https://minio.nplus1.ru/app-images/1146094/conversions/6ac79f7fe3ca4_cover-share.png","source":"N + 1"},{"title":"Ученые объяснили проблемы со здоровьем у детей, зачатых через ЭКО","link":"https://naked-science.ru/article/medicine/ubolezni-deti-eko-transpozony","date":1791463765000,"summary":"Процедура экстракорпорального оплодотворения (ЭКО) подразумевает оплодотворение вне женского организма. Она включает извлечение яйцеклеток из яичников и их оплодотворение сперматозоидами в лабораторных условиях. Один или несколько получившихся эмбрионов спустя некоторое время переносят в матку.","image":"https://naked-science.ru/wp-content/uploads/2026/10/20240117_gaf_u39_1268-1536x1004-2-1-1-.jpg","source":"Naked Science"},{"title":"Туфли для Золушки","link":"https://nplus1.ru/blog/2026/10/08/perst-125","date":1791463200000,"summary":"Обувь может подходить по длине, но все равно жать по бокам. Производители учитывают и длину, и полноту стопы, однако, как правило, разрабатывают колодку только для одного размера и затем просто увеличивают или уменьшают ее для остальных.","image":"https://minio.nplus1.ru/app-images/1146078/conversions/6ac78bbdeff31_cover-share.png","source":"N + 1"},{"title":"Хроническую боль предложили лечить не обезболиванием, а «отключением» сигнала в нервах","link":"https://naked-science.ru/article/medicine/bol-otkluchenie","date":1791460644000,"summary":"Боль после повреждения нерва может сохраняться гораздо дольше, чем сама первоначальная травма. Дело в том, что чувствительные нейроны продолжают посылать тревожные сигналы, а системы их обработки в спинном и головном мозге становятся слишком отзывчивыми.","image":"https://naked-science.ru/wp-content/uploads/2026/10/rgs4_structure_1200x675.webp","source":"Naked Science"},{"title":"ВОЗ порекомендовала лечить ожирение у детей без лекарств и операций","link":"https://nplus1.ru/news/2026/10/08/no-drugs-for-obese-children","date":1791458160000,"summary":"Всемирная организация здравоохранения выпустила первые глобальные руководства по борьбе с ожирением у детей и подростков и изложила их основные положения в пресс-релизе. Согласно этим документам, фармакологическое лечение и операции по уменьшению желудка детям младше 10 лет не показаны, а у подростков допустимы только…","image":"https://minio.nplus1.ru/app-images/1145884/conversions/6ac6c36e973a6_cover-share.png","source":"N + 1"},{"title":"Нобелевскую премию по литературе присудили канадской писательнице Энн Карсон","link":"https://nplus1.ru/news/2026/10/08/lit-nobel-2026","date":1791457440000,"summary":"Лауреаткой Нобелевской премии по литературе в 2026 году стала канадская писательница и поэтесса Энн Карсон (Anne Carson). Награду присудили ей за «смелое и новаторское творчество, которое в игривом диалоге с классической традицией создало новые формы для современной литературы».","image":"https://minio.nplus1.ru/app-images/1146042/conversions/6ac7641f8318a_cover-share.png","source":"N + 1"},{"title":"Нобелевскую премию по литературе 2026 года присудили канадской писательнице Энн Карсон","link":"https://naked-science.ru/article/media/nobelevka-po-literature-26","date":1791457387000,"summary":"Нобелевскую премию по литературе — 2026 получила канадская писательница, поэтесса, эссеист и переводчик Энн Карсон «за смелое и новаторское творчество, которое в игривом диалоге с классической традицией создало новые формы для современной литературы». Об этом сообщила Шведская академия в Стокгольме.","image":"https://naked-science.ru/wp-content/uploads/2026/10/1-3_2-6ac7705550d4e-scaled-compressed.webp","source":"Naked Science"},{"title":"Археологи впервые описали деревянную утварь, инструменты и палицу у неандертальцев","link":"https://naked-science.ru/article/anthropology/neandertaltsy-delali-podnosy","date":1791452083000,"summary":"Люди обрабатывали дерево, судя по характерным следам износа на каменных орудиях, не менее двух миллионов лет. Учитывая, что самые простые деревянные орудия вроде заостренных палок применяют на охоте и шимпанзе, это вполне ожидаемо.","image":"https://naked-science.ru/wp-content/uploads/2026/10/photo_2026-10-08_11-04-58_11zon.jpg","source":"Naked Science"}]},{"id":"fishing","title":"Рыбалка","items":[{"title":"Angler Measures a Lifetime of Fishing in 218 Bass Weighing Over 10 Pounds","link":"https://www.wired2fish.com/news/angler-measures-a-lifetime-of-fishing-in-218-bass-weighing-over-10-pounds","date":1791468000000,"summary":"For most bass fishermen, catching a 10-pound bass is a lifetime achievement. But for 80-year-old Larry Walker of Irving, Texas, it’s a number he has hit 218 times. And he isn’t finished yet. The Most Recent Big Catches On Sept.","image":"https://www.wired2fish.com/wp-content/uploads/2026/10/Walker_Bass_closeup-1024x576.webp","source":"Wired2Fish"},{"title":"Review: The Sunline Almight Isn’t Your Regular Braided Fishing Line","link":"https://www.wired2fish.com/tackle-reviews/review-the-sunline-almight-sinking-braid","date":1791457200000,"summary":"Everyone knows traditional braided fishing line floats. Fluorocarbon tends to sink. And mono is mostly slow sinking. It’s just something you get used to over time. But then I got to try out the Sunline Almight braided sinking line, pulled straight from the Japanese Domestic Market (JDM), but available in the U.S.","image":"https://www.wired2fish.com/wp-content/uploads/2026/10/Sunline-Almight-Sinking-Braid3-1024x576.webp","source":"Wired2Fish"},{"title":"Все о сыпучей прикормке в карпфишинге. Магическая панировка для любого спод-микса","link":"https://carptoday.ru/vse-o-sypuchej-prikormke-v-karpfishinge-magicheskaya-panirovka-dlya-lyubogo-spod-miksa/","date":1791288038000,"summary":"Прошли те времена, когда в сумках у карпятников можно было увидеть покупные или самодельные парашюты из бутылок. Загружалось столь простое изобретение всякими разными шарами из сыпучей прикормки с кукурузой, зерном, коноплей и резаными бойлами.","image":"https://carptoday.ru/wp-content/uploads/2026/04/kak_zabrasyvat_prikormku_parashyutom.jpg","source":"Carp Today"},{"title":"PRADCO Acquires Kent Outdoors","link":"https://www.wired2fish.com/fishing-industry-news/pradco-acquires-kent-outdoors","date":1791388800000,"summary":"PRADCO Outdoor Brands, the fishing and hunting heavyweight behind powerhouses like Great Lakes Finesse , Bomber, Cotton Cordell, Heddon, and YUM, is officially making a splash into the watersports arena.","image":"","source":"Wired2Fish"},{"title":"An Angler Made $132,000 Catching ‘Trash Fish’","link":"https://www.wired2fish.com/news/an-angler-made-132000-catching-trash-fish","date":1791381600000,"summary":"Making six figures just by catching fish probably sounds like an impossible dream. And, sure, it’s pretty hard to do — but, as one Pacific Northwest angler recently proved, it’s not impossible. Especially if you’re really, really good at catching northern pikeminnows.","image":"https://www.wired2fish.com/wp-content/uploads/2026/01/pikeminnow_wdfw-1024x575.webp","source":"Wired2Fish"},{"title":"Bar Crusher launches 650C and 650HT at Docklands","link":"https:   function plural(n, one, few, many) {
    const m10 = n % 10, m100 = n % 100;
    if (m10 === 1 && m100 !== 11) return one;
    if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return few;
    return many;
  }
  function issueNumber(t) {
    const d = new Date(mskDay(t));
    return Math.floor((d - new Date(d.getUTCFullYear() + "-01-01")) / 86400000) + 1;
  }
  const dateLine = (t) => fFull.format(t).replace(/\s*г\.$/, "").replace(/^./, (c) => c.toUpperCase()) + " года";

  /* ---------- pieces of the issue ---------- */

  let issue = null;

  const meta = (it) =>
    `<div class="meta">${esc(it.source)}${it.date ? " · " + esc(when(it.date)) : ""}${isForeign(it.title) ? '<span class="lang">EN</span>' : ""}</div>`;

  const picture = (src) =>
    src ? `<figure class="pic"><img src="${esc(safeUrl(src))}" alt="" referrerpolicy="no-referrer" decoding="async"></figure>` : "";

  const itemHtml = (it) => `<a class="item" href="${esc(safeUrl(it.link))}" target="_blank" rel="noopener">
      <h4 class="hl">${esc(it.title)}</h4>
      ${it.summary ? `<p>${esc(it.summary)}</p>` : ""}
      ${meta(it)}
    </a>`;

  function mastheadHtml(sections) {
    const t = issue.printedAt;
    const notes = (issue.sections || []).reduce((n, s) => n + s.items.length, 0);
    const jobs = issue.jobs?.items.length || 0;
    const lots = issue.market?.items?.length || 0;
    const ear = `<div class="ear-label">Цена свободная</div>
      <div class="ear-text">${notes} ${plural(notes, "заметка", "заметки", "заметок")},
        ${jobs} ${plural(jobs, "вакансия", "вакансии", "вакансий")},
        ${lots} ${plural(lots, "лот", "лота", "лотов")} на барахолке</div>`;
    const toc = sections.map((s) => `<li><a href="#" data-go="${esc(s.id)}">${esc(s.title)}</a><span data-toc="${esc(s.id)}"></span></li>`).join("");
    return `<div class="mast">
      <div class="mast-top">
        <span>Выпуск № ${issueNumber(t)} · Год издания первый</span>
        <span>Отпечатано ${mskDay(t) === mskDay(Date.now()) ? "сегодня" : esc(fShortDay.format(t))} в ${fTime.format(t)}</span>
      </div>
      <div class="mast-row">
        <div class="ear">${ear}</div>
        <h1 class="title">Газета</h1>
        <div class="ear ear-toc"><div class="ear-label">В номере</div><ol>${toc}</ol></div>
      </div>
      <div class="dateline">
        <span>${esc(dateLine(t))}</span>
        <span class="motto">Ежедневное издание для одного читателя</span>
        <span>Москва</span>
      </div>
    </div>`;
  }

  function weatherHtml(w) {
    if (!w) return `<div class="block-title">Погода</div><div class="empty">Метеосводка не поступила.</div>`;
    const parts = w.parts.map((p) => `<th>${esc(p.label)}</th>`).join("");
    const glyphs = w.parts.map((p) => `<td class="g" title="${esc(p.text)}">${p.glyph}</td>`).join("");
    const temps = w.parts.map((p) => `<td class="t">${deg(p.temp)}</td>`).join("");
    const rain = w.parts.map((p) => `<td>${p.rain ?? 0}%</td>`).join("");
    const days = w.days.slice(1).map((d) => {
      const t = Date.parse(d.date + "T12:00:00+03:00");
      return `<tr><td>${esc(fWeekdayShort.format(t))}, ${esc(fShortDay.format(t).replace(".", ""))}</td>
        <td class="g" title="${esc(d.text)}">${d.glyph}</td><td class="t">${deg(d.max)}</td><td>${deg(d.min)}</td><td>${d.rain ?? 0}%</td></tr>`;
    }).join("");
    const today = w.days[0];
    return `<div class="wx-col"><div class="block-title">Погода в Москве</div>
      <div class="wx-now"><span class="big">${deg(w.temp)}</span><span class="glyph">${w.glyph}</span><span class="desc">${esc(w.text)}</span></div>
      <div class="wx-facts">Ощущается как ${deg(w.feels)}. Ветер ${esc(windDir(w.windDir))}, ${Math.round(w.wind)} м/с. Влажность ${w.humidity}%, давление ${w.pressure} мм рт. ст.</div></div>
      <div class="wx-col"><div class="block-title">Сегодня</div><table class="wx-table"><thead><tr>${parts}</tr></thead><tbody><tr>${glyphs}</tr><tr>${temps}</tr><tr>${rain}</tr></tbody></table></div>
      <div class="wx-col"><table class="wx-table wx-days"><thead><tr><th>Дни</th><th></th><th>день</th><th>ночь</th><th title="Вероятность осадков">☂</th></tr></thead><tbody>${days}</tbody></table>
      ${today ? `<div class="wx-sun">Восход ${esc(today.sunrise)}, заход ${esc(today.sunset)}.</div>` : ""}</div>`;
  }

  function pickFeature(items) {
    let i = items.findIndex((x) => x.image && x.summary);
    if (i < 0) i = items.findIndex((x) => x.summary);
    return Math.max(0, i);
  }

  // A block is one unbreakable piece of the paper. `span` blocks stretch over
  // all columns; `brk` starts a new page; `sec` lets a continuation get a heading.
  function buildBlocks() {
    const out = [];
    let n = 0;
    const add = (b) => out.push({ bid: "b" + n++, ...b });
    const sections = issue.sections || [];
    const [main, ...rubrics] = sections;

    const tocSections = rubrics.filter((s) => s.items.length).map((s) => ({ id: s.id, title: s.title }));
    tocSections.push({ id: "ads", title: "Объявления" });
    add({ span: true, kind: "mast", html: mastheadHtml(tocSections) });

    add({ span: true, kind: "wx", html: `<div class="wx">${weatherHtml(issue.weather)}</div>` });
    const mainItems = main?.items || [];
    if (mainItems.length) {
      const li = pickFeature(mainItems);
      const lead = mainItems[li];
      add({
        span: true, kind: "lead", sec: main.id, html: `<a class="lead" href="${esc(safeUrl(lead.link))}" target="_blank" rel="noopener">
          <div class="kicker">${esc(main.title)}</div>
          <h2 class="hl">${esc(lead.title)}</h2>
          <div class="lead-body${lead.image ? "" : " no-img"}">${picture(lead.image)}
            <div>${lead.summary ? `<p class="summary">${esc(lead.summary)}</p>` : ""}${meta(lead)}</div>
          </div></a>`,
      });
      mainItems.forEach((it, i) => i !== li && add({ kind: "item", sec: main.id, secTitle: main.title, html: itemHtml(it) }));
    }

    for (const sec of rubrics) {
      const count = sec.items.length;
      const head = `<div class="rubric-head"><h3>${esc(sec.title)}</h3><span class="count">${count ? count + " " + plural(count, "заметка", "заметки", "заметок") : ""}</span></div>`;
      if (!count) {
        add({ span: true, kind: "head", sec: sec.id, html: `<div class="rubric">${head}<div class="empty">Свежих материалов в рубрике нет.</div></div>` });
        continue;
      }
      const fi = pickFeature(sec.items);
      const f = sec.items[fi];
      add({
        span: true, kind: "head", sec: sec.id, html: `<div class="rubric">${head}
          <a class="feature${f.image ? "" : " no-img"}" href="${esc(safeUrl(f.link))}" target="_blank" rel="noopener">${picture(f.image)}
            <div><h4 class="hl">${esc(f.title)}</h4>${f.summary ? `<p>${esc(f.summary)}</p>` : ""}${meta(f)}</div></a></div>`,
      });
      sec.items.forEach((it, i) => i !== fi && add({ kind: "item", sec: sec.id, secTitle: sec.title, html: itemHtml(it) }));
    }

    // Classifieds: jobs, then the flea market.
    const jobs = issue.jobs;
    const kw = (issue.keywords || []).join(", ");
    const dayT = jobs ? Date.parse(jobs.day + "T12:00:00+03:00") : 0;
    add({
      span: true, brk: true, kind: "ads-head", sec: "ads", html: `<div class="ads-head">
        <div class="ads-kicker">Объявления</div><h3>Требуются</h3>
        <p>${esc(kw)}${jobs ? " · опубликованы " + esc(fDayMonth.format(dayT)) : ""}</p></div>`,
    });
    if (jobs?.items.length) {
      for (const v of jobs.items) {
        add({
          kind: "ad", sec: "ads", secTitle: "Требуются", html: `<a class="ad${v.salary ? " top" : ""}" href="${esc(safeUrl(v.url))}" target="_blank" rel="noopener">
            <div class="ad-title">${esc(v.title)}</div>
            ${v.company ? `<div class="ad-company">${esc(v.company)}</div>` : ""}
            ${v.place ? `<div class="ad-place">${esc(v.place)}</div>` : ""}
            ${v.salary ? `<div class="ad-salary">${esc(v.salary)}</div>` : ""}
            <div class="ad-foot"><span>${esc(v.source)}</span>${v.isNew && v.source !== "hh.ru" ? '<span class="new">новая</span>' : ""}</div></a>`,
        });
      }
    } else {
      add({ kind: "note", sec: "ads", html: `<div class="empty">${jobs ? "Вчера подходящих объявлений не нашлось." : "Объявления о работе не поступили."}</div>` });
    }
    const jobNotes = [];
    if (jobs?.hhPeriod === "day") jobNotes.push("Объявления hh.ru — за последние сутки.");
    if (jobs?.notes) jobNotes.push(...jobs.notes);
    const hhLinks = (jobs?.hhLinks || []).map((u, i, a) =>
      `<a href="${esc(safeUrl(u))}" target="_blank" rel="noopener">${a.length > 1 ? (i === 0 ? "hh.ru: Москва" : "hh.ru: удалённо") : "hh.ru"}</a>`).join(" · ");
    if (hhLinks || jobNotes.length) {
      add({ kind: "note", sec: "ads", html: `<div class="ad-note">${hhLinks ? `<div>Поиск: ${hhLinks}</div>` : ""}${jobNotes.map((x) => `<div>${esc(x)}</div>`).join("")}</div>` });
    }

    const market = issue.market;
    add({
      span: true, kind: "market-head", sec: "market", html: `<div class="ads-head market-head">
        <h3>Барахолка</h3><p>${esc(issue.marketTitle || "Ретро-консоли")} · продают в Москве</p></div>`,
    });
    if (market?.items?.length) {
      for (const m of market.items) {
        add({
          kind: "ad", sec: "market", secTitle: "Барахолка", html: `<a class="ad lot" href="${esc(safeUrl(m.url))}" target="_blank" rel="noopener">
            ${m.image ? `<figure class="pic lot-pic"><img src="${esc(safeUrl(m.image))}" alt="" referrerpolicy="no-referrer" decoding="async"></figure>` : ""}
            <div class="ad-title">${esc(m.title)}</div>
            ${m.price ? `<div class="ad-salary">${esc(m.price)}</div>` : ""}
            ${m.place ? `<div class="ad-place">${esc(m.place)}</div>` : ""}
            <div class="ad-foot"><span>${esc(m.source)}</span>${m.date ? `<span>${esc(m.date)}</span>` : ""}</div></a>`,
        });
      }
    } else {
      add({ kind: "note", sec: "market", html: `<div class="empty">Объявления о продаже не поступили.</div>` });
    }
    const mNotes = [...(market?.notes || [])];
    if (market?.stale) mNotes.push(`Объявления из выпуска от ${when(market.stale)}.`);
    const mLinks = (market?.links || []).map((l) => `<a href="${esc(safeUrl(l.url))}" target="_blank" rel="noopener">${esc(l.label)}</a>`).join(" · ");
    add({ kind: "note", sec: "market", html: `<div class="ad-note">${mLinks ? `<div>Искать самому: ${mLinks}</div>` : ""}${mNotes.map((x) => `<div>${esc(x)}</div>`).join("")}</div>` });

    const sources = new Set();
    sections.forEach((s) => s.items.forEach((i) => sources.add(i.source)));
    add({
      span: true, kind: "colophon", html: `<div class="colophon">
        <div class="block-title">Выходные данные</div>
        <p>«Газета» — ежедневное издание для одного читателя. Отпечатано ${esc(dateLine(issue.printedAt).toLowerCase())} в ${fTime.format(issue.printedAt)}.</p>
        <p>Источники: ${esc([...sources].join(", "))}; погода — Open-Meteo; вакансии — hh.ru, «Работа России»; объявления — Юла, Авито.</p>
        <p>Нажмите на заметку, чтобы прочитать её целиком.</p></div>`,
    });
    return out;
  }

  /* ---------- layout on pages ---------- */

  let root = null;       // element the paper lives in
  let book, slotL, slotR, measure, indicator;
  let blocks = [];
  let pages = [];        // detached .page elements
  let sectionPage = {};  // section id → page index
  let W = 0, H = 0, mode = "spread";
  let cur = 0;           // current spread (or page in single mode)
  let busy = false;
  const listeners = new Set();

  const toNode = (html) => { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstElementChild; };

  function newPage(index) {
    const p = document.createElement("div");
    p.className = "page " + (index % 2 ? "even" : "odd");
    p.dataset.index = index;
    p.innerHTML = (index === 0 ? "" : `<div class="running"><span>${index + 1}</span><span class="running-title">Газета</span><span>${esc(dateLine(issue.printedAt))}</span></div>`) +
      `<div class="page-body"></div><div class="folio">— ${index + 1} —</div>`;
    return p;
  }

  const overflows = (body) => body.scrollHeight > body.clientHeight + 1 || body.scrollWidth > body.clientWidth + 1;

  function columnsFor(width) {
    return Math.max(1, Math.min(4, Math.floor((width - 44) / 185)));
  }

  function paginate() {
    measure.style.setProperty("--pw", W + "px");
    measure.style.setProperty("--ph", H + "px");
    measure.style.setProperty("--cols", columnsFor(W));
    measure.replaceChildren();
    pages = [];
    sectionPage = {};
    let page, body;
    const open = () => { page = newPage(pages.length); measure.append(page); body = page.querySelector(".page-body"); };
    const close = () => { page.remove(); pages.push(page); };
    open();
    for (const b of blocks) {
      if (b.brk && body.children.length) { close(); open(); }
      const node = toNode(b.html);
      node.classList.add("blk", "k-" + b.kind);
      if (b.span) node.classList.add("span");
      node.dataset.bid = b.bid;
      body.append(node);
      if (overflows(body)) {
        node.remove();
        if (body.children.length && !(body.children.length === 1 && body.firstElementChild.classList.contains("k-cont"))) {
          close(); open();
          if (b.secTitle && b.kind !== "head") {
            const c = toNode(`<div class="cont-head">${esc(b.secTitle)} <i>— продолжение</i></div>`);
            c.classList.add("blk", "span", "k-cont");
            body.append(c);
          }
        }
        body.append(node);
        // Too big for an empty page: drop the picture and the text, keep the headline.
        if (overflows(body)) node.classList.add("squeeze");
        if (overflows(body)) node.classList.add("squeeze-more");
      }
      if (b.sec && !(b.sec in sectionPage)) sectionPage[b.sec] = pages.length;
    }
    close();
    // Page numbers in the front-page contents.
    pages[0].querySelectorAll("[data-toc]").forEach((el) => {
      const p = sectionPage[el.dataset.toc];
      el.textContent = p != null ? p + 1 : "";
    });
  }

  /* ---------- spreads ---------- */

  const spreadCount = () => (mode === "spread" ? Math.ceil((pages.length - 1) / 2) + 1 : pages.length);
  const pageToSpread = (p) => (mode === "spread" ? (p === 0 ? 0 : Math.floor((p + 1) / 2)) : p);
  function spreadPages(s) {
    if (mode !== "spread") return [null, s];
    if (s === 0) return [null, 0];
    return [2 * s - 1, 2 * s < pages.length ? 2 * s : null];
  }
  function shiftFor(s) {
    if (mode !== "spread") return 0;
    const [l, r] = spreadPages(s);
    if (l == null) return -W / 2;
    if (r == null) return W / 2;
    return 0;
  }

  function put(slot, index) {
    slot.replaceChildren();
    if (index != null && pages[index]) slot.append(pages[index]);
    slot.classList.toggle("blank", index == null);
  }

  function show() {
    const [l, r] = spreadPages(cur);
    put(slotL, l);
    put(slotR, r);
    book.style.transform = `translateX(${shiftFor(cur)}px)`;
    const shown = [l, r].filter((x) => x != null).map((x) => x + 1);
    indicator.textContent = `${shown.length > 1 ? "Стр. " + shown.join("–") : "Стр. " + shown[0]} из ${pages.length}`;
    root.querySelector(".turn.prev").hidden = cur === 0;
    root.querySelector(".turn.next").hidden = cur >= spreadCount() - 1;
    listeners.forEach((fn) => fn({ spread: cur, pages: shown, total: pages.length }));
  }

  function face(index, side) {
    const f = document.createElement("div");
    f.className = "face " + side;
    if (index != null && pages[index]) f.append(pages[index].cloneNode(true));
    else f.classList.add("blank");
    const shade = document.createElement("div");
    shade.className = "shade";
    f.append(shade);
    return f;
  }

  function flipTo(target, instant) {
    target = Math.max(0, Math.min(spreadCount() - 1, target));
    if (busy || target === cur) return;
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (instant || reduce) { cur = target; show(); return; }
    busy = true;
    const fwd = target > cur;
    const [cl, cr] = spreadPages(cur);
    const [tl, tr] = spreadPages(target);
    const leaf = document.createElement("div");
    let from, to;
    if (mode === "spread") {
      leaf.className = "leaf " + (fwd ? "on-right" : "on-left");
      leaf.append(face(fwd ? cr : cl, "front"), face(fwd ? tl : tr, "back"));
      if (fwd) put(slotR, tr); else put(slotL, tl);
      from = 0; to = fwd ? -180 : 180;
    } else {
      // A single page turns over its left edge like a notebook sheet.
      leaf.className = "leaf on-right single";
      if (fwd) { leaf.append(face(cr, "front"), face(null, "back")); put(slotR, tr); from = 0; to = -180; }
      else { leaf.append(face(tr, "front"), face(null, "back")); from = -180; to = 0; }
    }
    book.append(leaf);
    const easing = "cubic-bezier(.4,.05,.3,1)";
    book.style.transition = `transform ${FLIP_MS}ms ${easing}`;
    book.style.transform = `translateX(${shiftFor(target)}px)`;
    const anim = leaf.animate(
      [{ transform: `rotateY(${from}deg)` }, { transform: `rotateY(${(from + to) / 2}deg) translateZ(30px)`, offset: 0.5 }, { transform: `rotateY(${to}deg)` }],
      { duration: FLIP_MS, easing }
    );
    const [front, back] = leaf.querySelectorAll(".shade");
    front.animate([{ opacity: 0 }, { opacity: 0.45 }], { duration: FLIP_MS / 2, easing: "ease-in", fill: "forwards" });
    back.animate([{ opacity: 0.45 }, { opacity: 0.45, offset: 0.5 }, { opacity: 0 }], { duration: FLIP_MS, easing: "ease-out", fill: "forwards" });
    anim.finished.then(() => {
      book.style.transition = "";
      cur = target;
      leaf.remove();
      show();
      busy = false;
    });
  }

  /* ---------- sizing ---------- */

  function measureStage() {
    const stage = root.querySelector(".stage");
    const sw = stage.clientWidth - 24, sh = stage.clientHeight - 20;
    let h = sh, w = Math.floor(h * RATIO), m = "spread";
    if (2 * w > sw) {
      if (sw / 2 >= 430) { w = Math.floor(sw / 2); }
      else { m = "single"; w = Math.min(sw, Math.floor(h * RATIO)); if (sw < 560) { w = sw; } }
    }
    return { w: Math.max(300, w), h: Math.max(420, Math.floor(h)), m };
  }

  function layout(keepPage) {
    const { w, h, m } = measureStage();
    // Remember the first block on screen to come back to it after re-pagination.
    let anchor = null;
    if (keepPage && pages.length) {
      const [l, r] = spreadPages(cur);
      const p = pages[l ?? r];
      anchor = p && p.querySelector(".blk:not(.k-cont)")?.dataset.bid;
    }
    W = w; H = h; mode = m;
    root.style.setProperty("--pw", W + "px");
    root.style.setProperty("--ph", H + "px");
    root.style.setProperty("--cols", columnsFor(W));
    root.classList.toggle("single", mode === "single");
    book.style.width = (mode === "spread" ? 2 * W : W) + "px";
    book.style.height = H + "px";
    paginate();
    let p = 0;
    if (anchor) p = Math.max(0, pages.findIndex((pg) => pg.querySelector(`[data-bid="${anchor}"]`)));
    cur = Math.min(pageToSpread(p), spreadCount() - 1);
    show();
  }

  /* ---------- input ---------- */

  function bindInput() {
    root.querySelector(".turn.prev").addEventListener("click", () => flipTo(cur - 1));
    root.querySelector(".turn.next").addEventListener("click", () => flipTo(cur + 1));
    document.addEventListener("keydown", (e) => {
      if (e.target.closest?.("input, textarea, select, dialog[open]")) return;
      if (["ArrowRight", "PageDown", " "].includes(e.key)) { e.preventDefault(); flipTo(cur + 1); }
      else if (["ArrowLeft", "PageUp"].includes(e.key)) { e.preventDefault(); flipTo(cur - 1); }
      else if (e.key === "Home") flipTo(0);
      else if (e.key === "End") flipTo(spreadCount() - 1);
    });
    let wheelLock = 0;
    root.querySelector(".stage").addEventListener("wheel", (e) => {
      const d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
      if (Math.abs(d) < 12 || Date.now() < wheelLock) return;
      wheelLock = Date.now() + FLIP_MS + 150;
      flipTo(cur + (d > 0 ? 1 : -1));
    }, { passive: true });
    let sx = null, sy = 0;
    root.querySelector(".stage").addEventListener("pointerdown", (e) => { sx = e.clientX; sy = e.clientY; });
    root.querySelector(".stage").addEventListener("pointerup", (e) => {
      if (sx == null || e.pointerType === "mouse") return;
      const dx = e.clientX - sx, dy = e.clientY - sy;
      sx = null;
      if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) flipTo(cur + (dx < 0 ? 1 : -1));
    });
    // Contents links on the front page jump to their page.
    root.addEventListener("click", (e) => {
      const a = e.target.closest("[data-go]");
      if (!a) return;
      e.preventDefault();
      goToSection(a.dataset.go);
    });
    // A picture that fails to load is dropped together with its column, also
    // in the stored page so the next flip does not show the hole again.
    document.addEventListener("error", (e) => {
      const img = e.target;
      if (img.tagName !== "IMG" || !root.contains(img)) return;
      const src = img.getAttribute("src");
      for (const p of pages) p.querySelectorAll("img").forEach((i) => i.getAttribute("src") === src && drop(i));
      drop(img);
    }, true);
    let t = null;
    addEventListener("resize", () => { clearTimeout(t); t = setTimeout(() => layout(true), 200); });
  }

  function drop(img) {
    img.closest(".feature, .lead-body")?.classList.add("no-img");
    img.closest("figure")?.remove();
  }

  function goToSection(id) {
    if (id in sectionPage) flipTo(pageToSpread(sectionPage[id]));
  }

  /* ---------- public ---------- */

  function mount(el) {
    root = el;
    root.classList.add("paper-root");
    root.insertAdjacentHTML("beforeend", `
      <div class="stage">
        <div class="book">
          <div class="slot left"></div><div class="slot right"></div>
        </div>
        <button class="turn prev" aria-label="Предыдущая страница" hidden><span>‹</span></button>
        <button class="turn next" aria-label="Следующая страница" hidden><span>›</span></button>
      </div>
      <div class="measure" aria-hidden="true"></div>`);
    book = root.querySelector(".book");
    slotL = root.querySelector(".slot.left");
    slotR = root.querySelector(".slot.right");
    measure = root.querySelector(".measure");
    indicator = document.createElement("span");
    bindInput();
  }

  async function render(data) {
    issue = data;
    blocks = buildBlocks();
    // Pagination measures text, so the newspaper fonts must be in place first.
    await document.fonts.ready;
    layout(pages.length > 0);
  }

  window.Paper = {
    mount,
    render,
    next: (instant) => flipTo(cur + 1, instant),
    prev: (instant) => flipTo(cur - 1, instant),
    first: () => flipTo(0),
    goToSection,
    get state() { return { spread: cur, spreads: spreadCount(), pages: pages.length, busy }; },
    get indicator() { return indicator; },
    onChange: (fn) => listeners.add(fn),
    sections: () => {
      const s = (issue?.sections || []).slice(1).filter((x) => x.items.length).map((x) => ({ id: x.id, title: x.title }));
      return [{ id: (issue?.sections || [])[0]?.id, title: "Первая полоса" }, ...s, { id: "ads", title: "Требуются" }, { id: "market", title: "Барахолка" }]
        .filter((x) => x.id in sectionPage).map((x) => ({ ...x, page: sectionPage[x.id] + 1 }));
    },
    utils: { esc, when, mskDay, fTime, fDayMonth, fShortDay },
  };
})();

  </script>
  <script>
"use strict";
// Web edition shell: the issue is embedded in the page as JSON.

(function () {
  const issue = JSON.parse(document.getElementById("issue-data").textContent);
  const { esc, fTime, fShortDay } = Paper.utils;
  const $ = (id) => document.getElementById(id);

  Paper.mount($("paper"));
  $("indicatorSlot").replaceWith(Paper.indicator);
  Paper.indicator.className = "indicator";
  $("prevBtn").addEventListener("click", () => Paper.prev());
  $("nextBtn").addEventListener("click", () => Paper.next());
  $("contents").addEventListener("change", (e) => { if (e.target.value) Paper.goToSection(e.target.value); });
  Paper.onChange(() => { $("contents").value = ""; });
  $("printed").textContent = `Выпуск от ${fShortDay.format(issue.printedAt).replace(".", "")}, ${fTime.format(issue.printedAt)}`;

  Paper.render(issue).then(() => {
    $("contents").innerHTML = '<option value="">В номере…</option>' +
      Paper.sections().map((s) => `<option value="${esc(s.id)}">${esc(s.title)} — стр. ${s.page}</option>`).join("");
  });
})();

  </script>
</body>
